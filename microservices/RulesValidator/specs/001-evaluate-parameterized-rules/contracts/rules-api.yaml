openapi: 3.0.3

info:
  title: RulesValidator API
  version: 1.0.0
  description: API para evaluación de reglas parametrizables.

paths:

  /api/v1/evaluar-reglas:
    post:
      summary: Evaluar reglas
      description: >
        Evalúa las reglas activas y vigentes aplicables al contexto solicitado.
        RulesValidator determina los flujos aplicables a partir del negocio,
        proceso, tipo de plan y etapa.

        El contexto contiene únicamente los datos dinámicos necesarios para
        evaluar las RuleDefinition seleccionadas.

        El consumidor no envía expresiones ejecutables ni expresiones de
        Microsoft RulesEngine.

      operationId: evaluarReglas

      tags:
        - EvaluarReglas

      parameters:

        - name: X-Correlation-ID
          in: header
          required: false
          description: >
            Identificador de correlación proporcionado por el consumidor.
            Si no se proporciona, RulesValidator genera uno.
          schema:
            type: string
            maxLength: 100

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluarReglasRequest'

            examples:

              pensionadoTp01:
                summary: Evaluación de vinculación TP-01
                value:
                  negocioId: SALUD
                  proceso: VINCULACION
                  tipoPlanId: TP-01
                  etapa: 4
                  fechaEvaluacion: '2026-11-21T15:30:00Z'
                  contexto:
                    pension.tipo: Vejez
                    pension.mesadaEnSmlmv: 1.3
                    person.genero: M
                    person.edad: 64
                    person.tipoDocumento: CC

      responses:

        '200':
          description: Evaluación ejecutada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluarReglasResponse'

        '400':
          description: Solicitud inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '404':
          description: >
            No existe el negocio, tipo de plan o configuración necesaria
            para resolver la evaluación solicitada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '422':
          description: >
            El contexto recibido no permite realizar una evaluación válida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '500':
          description: Error interno durante la evaluación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'


components:

  schemas:

    EvaluarReglasRequest:
      type: object
      additionalProperties: false

      required:
        - negocioId
        - proceso
        - contexto

      properties:

        negocioId:
          type: string
          maxLength: 20
          description: >
            Identificador del negocio definido por el Core de Vinculaciones.
            Ejemplos: SALUD, CAJA.
          example: SALUD

        proceso:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Código del proceso para el cual se solicita la evaluación.
          example: VINCULACION

        tipoPlanId:
          type: string
          maxLength: 10
          nullable: true
          description: >
            Identificador del tipo de plan definido en el Core de
            Vinculaciones. Es requerido funcionalmente cuando el proceso
            necesita discriminar las reglas por tipo de plan.
          example: TP-01

        etapa:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Etapa del proceso que se desea evaluar. Solo se informa cuando
            el proceso utiliza etapas.
          example: 4

        fechaEvaluacion:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha UTC utilizada para determinar la vigencia de las reglas.
            Si no se informa, RulesValidator utiliza la fecha UTC actual
            proporcionada por su reloj de aplicación.
          example: '2026-11-21T15:30:00Z'

        contexto:
          type: object
          description: >
            Diccionario dinámico con los valores disponibles para evaluar las
            reglas seleccionadas. Los nombres deben corresponder con campos
            autorizados por RulesValidator.

            Los campos necesarios son determinados por las reglas activas y
            vigentes aplicables a la evaluación.

            No debe repetir tipoPlanId como un campo del contexto.
          additionalProperties: true
          example:
            pension.tipo: Vejez
            pension.mesadaEnSmlmv: 1.3
            person.genero: M
            person.edad: 64
            person.tipoDocumento: CC


    EvaluarReglasResponse:
      type: object
      additionalProperties: false

      required:
        - idEvaluacion
        - idCorrelacion
        - resultadoGeneral
        - fechaEvaluacion
        - resultados

      properties:

        idEvaluacion:
          type: string
          format: uuid
          description: >
            Identificador generado por RulesValidator para la evaluación.

        idCorrelacion:
          type: string
          maxLength: 100
          description: >
            Identificador de correlación recibido o generado por
            RulesValidator.

        resultadoGeneral:
          type: string
          enum:
            - CUMPLE
            - NO_CUMPLE
            - INDETERMINADO
          description: Resultado consolidado de la evaluación.

        fechaEvaluacion:
          type: string
          format: date-time

        resultados:
          type: array
          items:
            $ref: '#/components/schemas/ResultadoRegla'


    ResultadoRegla:
      type: object
      additionalProperties: false

      required:
        - codigoRegla
        - version
        - resultado
        - severidad

      properties:

        codigoRegla:
          type: string
          maxLength: 50
          example: RV-002

        version:
          type: integer
          minimum: 1
          example: 1

        resultado:
          type: string
          enum:
            - CUMPLE
            - NO_CUMPLE
            - INDETERMINADO

        severidad:
          type: string
          enum:
            - INFORMATIVA
            - ADVERTENCIA
            - BLOQUEANTE

        codigoError:
          type: string
          nullable: true
          maxLength: 100
          example: ERR-RV-002

        mensaje:
          type: string
          nullable: true
          maxLength: 1000
          example: >
            La mesada pensional supera el límite permitido.


    ProblemDetails:
      type: object

      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        instance:
          type: string

        codigo:
          type: string

        idCorrelacion:
          type: string